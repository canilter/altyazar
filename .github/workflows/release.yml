# SPDX-License-Identifier: AGPL-3.0-only
# Altyazar sürümü: v* etiketi gönderilince (ya da Actions sekmesinden elle) Windows kurulum dosyasını ve Android TV
# paketini derler, GitHub sürümü olarak yayınlar. Mac, LG ve Samsung paketleri bu çatalda yayınlanmaz.
# TV_KEYSTORE_* sırları yoksa TV paketi geliştirme anahtarıyla imzalanır; masaüstü uygulaması imzası farklı eski
# kopyayı kaldırıp yenisini kurar.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    uses: ./.github/workflows/tv-android.yml
    secrets: inherit
    with:
      require-signing: false

  windows:
    needs: android
    uses: ./.github/workflows/windows.yml
    with:
      with-android: true

  publish:
    runs-on: ubuntu-latest
    needs: [windows, android]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Dosyaları hazırla
        run: |
          mkdir -p out
          cp artifacts/couchsubs-windows-installer/* out/
          for apk in artifacts/couchsubs-android/*.apk; do cp "$apk" out/Altyazar-androidtv.apk; break; done
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -l out

      - name: Sürümü yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --title "Altyazar ${GITHUB_REF_NAME#v}" \
            --notes "Windows: Altyazar-windows-Setup.exe dosyasını indirip açın. Google TV paketi kurulumda otomatik yüklenir." --latest
